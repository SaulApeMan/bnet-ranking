<main><h1 data-pl="O projekcie" data-en="About the project">About the project</h1><p data-pl="Projekt SaulApeMan: automatyczne zbieranie i analiza danych Warcraft III (Reforged / Classic). Ranking jest odczytywany z gry zrzutami ekranu i rozpoznawany skryptami; strona jest generowana statycznie z lokalnej bazy danych."
 data-en="SaulApeMan project: automated collection and analysis of Warcraft III data (Reforged / Classic). The ladder is read from the game with screenshots and recognised by scripts; this site is generated statically from a local database."></p>
<div class="cards"><div class="card"><b id="patch"></b><span data-pl="numer patcha" data-en="patch number"></span></div>

<h2 data-pl="Co widać na stronie" data-en="What you see here"></h2>
<ul><li data-pl="Wyłącznie dane widoczne w rankingu gry: nazwa wyświetlana, rasa, ikona, MMR, wygrane/przegrane." data-en="Only data visible in the in-game ladder: display name, race, icon, MMR, wins/losses."></li>
<li data-pl="Nic poza tym, co pokazuje ranking w grze. Nicki zapisane znakami spoza alfabetu łacińskiego (np. koreańskie) pokazujemy jako tekst odczytany z obrazka nicka albo jako sam wycinek obrazka." data-en="Nothing beyond what the in-game ladder shows. Nicks written in other scripts (e.g. Korean) are shown as the text read from the nick picture or as the picture itself."></li>
<li data-pl="Wiersz rankingu to nie zawsze unikalny gracz: jedna osoba może mieć wpisy dla kilku ras." data-en="A ladder row is not always a unique player: one person can have entries for several races."></li>
<li data-pl="Każdy tryb jest skanowany w całości, a strona pokazuje tylko skany oznaczone jako kompletne." data-en="Every mode is scanned in full, and the site shows only scans marked as complete."></li></ul>
<h2 data-pl="Jak liczymy" data-en="How we count"></h2>
<ul><li data-pl="Skan: czytamy każdą stronę rankingu w grze (zrzut ekranu i rozpoznawanie tekstu). Godzina skanu to koniec skanu, w Twojej strefie czasowej." data-en="Scan: we read every page of the in-game ladder (screenshot and text recognition). The scan time is the end of the scan, in your time zone."></li>
<li data-pl="BattleTagi: odsetek wierszy rankingu, dla których znamy BattleTag. Zaokrąglamy w dół, więc 100% oznacza, że naprawdę znamy wszystkie." data-en="BattleTags: the share of ladder rows whose BattleTag we know. We round down, so 100% means we really know all of them."></li>
<li data-pl="Drużyny zgrane (AT): wiersz to drużyna. BattleTagi to odsetek znanych członków drużyn, a pełne składy to drużyny, w których znamy wszystkich graczy." data-en="Arranged teams (AT): a row is a team. BattleTags = the share of known team members; full line-ups = teams with every player known."></li>
<li data-pl="Aktywność: porównujemy dwa kolejne skany. Gracza łączymy po BattleTagu, a bez tagu po nazwie i rasie (tylko jednoznacznie). Gry, wygrane i przegrane to różnica między skanami." data-en="Activity: we compare two consecutive scans. A player is matched by BattleTag, and without a tag by name and race (only when unambiguous). Games, wins and losses are the difference between the scans."></li>
<li data-pl="Gry na dobę: każda gra liczona raz, podzielona przez długość okna między skanami." data-en="Games per day: every game counted once, divided by the length of the window between the scans."></li>
<li data-pl="Różni gracze: unikalne BattleTagi, które zagrały co najmniej jedną grę między dwoma kolejnymi skanami." data-en="Different players: unique BattleTags that played at least one game between two consecutive scans."></li>
<li data-pl="MMR: z ostatniego kompletnego skanu. Środkowe 80% rankingu to zakres od 10. do 90. percentyla." data-en="MMR: from the latest complete scan. The middle 80% of the ladder is the range from the 10th to the 90th percentile."></li>
<li data-pl="Pozycja w rankingu gry zależy od poziomu konta, nie od MMR." data-en="The in-game ladder rank follows account level, not MMR."></li>
<li data-pl="W3Champions: graczy łączymy dokładnie po BattleTagu. Skale MMR obu serwisów są różne, więc nie porównuj ich wprost." data-en="W3Champions: players are matched exactly by BattleTag. The two services use different MMR scales, so do not compare them directly."></li>
<li data-pl="Wartości odczytujemy z obrazu, więc pojedyncze liczby mogą być błędne." data-en="Values are read from screenshots, so single numbers may be wrong."></li></ul>
<p data-pl="Dane pochodzą z publicznego rankingu gry Warcraft III. Jeśli chcesz, aby Twój wpis (nick lub BattleTag) zniknął ze strony, otwórz zgłoszenie (Issues) w repozytorium tej strony na GitHubie, a zostanie usunięty przy następnej aktualizacji." data-en="The data come from the public Warcraft III in-game ladder. If you want your entry (nick or BattleTag) removed from this site, open an issue in this site's GitHub repository and it will be removed in the next update."></p>
<p class="dim" data-pl="Warcraft III jest znakiem towarowym Blizzard Entertainment. Strona jest nieoficjalna." data-en="Warcraft III is a trademark of Blizzard Entertainment. This site is unofficial."></p></main>
